plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hermes.tvlive'
    compileSdk 35

    defaultConfig {
        applicationId "com.hermes.tvlive"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // 盒子是 armeabi-v7a，同时保留 arm64 给新设备
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // 固定签名：本地和 GitHub Actions 用同一把钥匙。
    // 否则每次 CI 生成的 debug keystore 都不同，装新版本会签名冲突。
    signingConfigs {
        release {
            storeFile file("../keystore/release.jks")
            storePassword "tvlive2026"
            keyAlias "tvlive"
            keyPassword "tvlive2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    // FFmpeg 软解扩展：补上 MP2 / AC-3 / E-AC-3 等 Android 原生缺的解码器
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.8.0-0.9.0'
}
